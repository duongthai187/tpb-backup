# Notify Service — Standalone Stack
# ====================================
# Independent from tpb-webhook. Uses host network to reach S1 Redis.
#
# Deploy:
#   TELEGRAM_BOT_TOKEN=xxx TELEGRAM_CHAT_ID=yyy docker compose up -d

name: tpb-notify

services:
  notify-1:
    build: .
    container_name: tpb_notify_1
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_URL: redis://192.168.255.71:6379/0
      STREAM_NAME: webhook:batches
      CONSUMER_GROUP: notify-telegram
      CONSUMER_NAME: notifier-1
      HEALTH_PORT: "8080"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      NOTIFY_TYPES: C,D
      PYTHONUNBUFFERED: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notify-2:
